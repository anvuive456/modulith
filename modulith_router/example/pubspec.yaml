name: modulith_router_example
description: "A single-file tour of modulith_router: persistent branch tabs, a guarded route, and a push that answers with a value."
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  modulith: ^0.1.0
  modulith_router:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
